# Two workers that are two machines, not two processes on one.
#
# What they share is what an operator is told to share: one Temporal cluster and one libSQL store.
# What they do not share is the session's working tree. `worker-a` has the project, `worker-b` gets
# an empty volume, so a session that moves between them has to rebuild the tree from the snapshot
# packs in the store. That is the part a single host can never really test, because there the tree
# is already sitting on the disk the other process is reading.
#
#   MODELS_JSON=$(mktemp) && curl -fsS https://models.opencode.ai/api.json -o "$MODELS_JSON"
#   MODELS_JSON=$MODELS_JSON docker compose -f packages/temporal/docker/compose.yml up -d temporal sqld serve worker-a
#
# The catalog comes from a file rather than from the network inside every container: what this
# stack is for is where a session's files go, and a catalog host having a slow afternoon should not
# be able to report that as a failure. `scripts/cross-host-check.sh` fetches it for you.
#
# Not covered: one libSQL server, so this shows a shared store over a network rather than a store
# that survives losing a node.

name: opencode-l3

# A mapping rather than a list, because a list cannot be merged: a service that adds one variable
# would otherwise replace the whole set and silently lose the store.
x-env: &env
  OPENCODE_SESSION_EXECUTION: temporal
  TEMPORAL_ADDRESS: temporal:7233
  # One store for every host. Without it a session belongs to whichever machine holds its file.
  OPENCODE_DB_URL: http://sqld:8080
  OPENCODE_TEMPORAL_STEPPED: "1"
  OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-l3-check}
  OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
  # The model catalog from a file the script fetched once, rather than from the network inside every
  # container. What this stack is for is where a session's files go; a catalog host having a slow
  # afternoon should not be able to report that as a failure.
  OPENCODE_MODELS_PATH: /models.json

# Each service lists its own volumes in full: a YAML merge key loses to an explicit key, so a list
# here would be dropped by the service that adds a project volume, models file included.
x-app: &app
  image: opencode-temporal:l3
  depends_on:
    temporal:
      condition: service_healthy
    sqld:
      condition: service_started

services:
  temporal:
    image: temporalio/admin-tools:1.29
    # The image's own entrypoint is `sleep infinity`, so a command alone becomes arguments to sleep.
    entrypoint: ["temporal"]
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--log-level", "warn"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 40

  sqld:
    image: ghcr.io/tursodatabase/libsql-server:latest
    environment:
      - SQLD_NODE=primary
    ports:
      - "8081:8080"

  # Drives workflows, hosts no worker, and is the only thing with an HTTP surface.
  # The engine's own source is mounted over the copy baked into the image on every service. bun runs
  # TypeScript directly, so a one-file change does not cost a full dependency install.
  serve:
    <<: *app
    environment:
      <<: *env
      OPENCODE_TEMPORAL_ROLE: client
    # Absolute, because working_dir is the project rather than the checkout: a relative entry path
    # would be looked for inside the session's tree.
    command: ["bun", "run", "/app/packages/cli/src/index.ts", "serve", "--port", "4096", "--hostname", "0.0.0.0"]
    working_dir: /work/project
    ports:
      - "4096:4096"
    volumes:
      - ../../core/src:/app/packages/core/src:ro
      - ../src:/app/packages/temporal/src:ro
      - ${MODELS_JSON:?set MODELS_JSON, or run the check that fetches it}:/models.json:ro
      - project-a:/work

  worker-a:
    <<: *app
    environment:
      <<: *env
      OPENCODE_TEMPORAL_ROLE: worker
    volumes:
      - ../../core/src:/app/packages/core/src:ro
      - ../src:/app/packages/temporal/src:ro
      - ${MODELS_JSON:?set MODELS_JSON, or run the check that fetches it}:/models.json:ro
      - project-a:/work

  # The volume is mounted one level above the project rather than at it, so the project directory is
  # an ordinary directory: a host that finds a call never came back can move it out of the way and
  # build a fresh one, where a mount point can only be refused.
  #
  # No project volume of its own that has ever seen this session: an empty tree, so the worktree has
  # to come from the packs in the store.
  worker-b:
    <<: *app
    environment:
      <<: *env
      OPENCODE_TEMPORAL_ROLE: worker
    volumes:
      - ../../core/src:/app/packages/core/src:ro
      - ../src:/app/packages/temporal/src:ro
      - ${MODELS_JSON:?set MODELS_JSON, or run the check that fetches it}:/models.json:ro
      - project-b:/work

volumes:
  project-a:
  project-b:
